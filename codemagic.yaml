workflows:
  ios-release:
    name: iOS Release

    environment:
      xcode: latest
      node: 18

    scripts:
      - node -v
      - npm -v
      - npm install -g cordova
      - cordova -v
      - npm ci
      - ls -la
      - cat package.json
      - cat package-lock.json | head -50
      - cordova platform add ios
      - cordova build ios --release

    artifacts:
      - platforms/ios/build/**/*.ipa