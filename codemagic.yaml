workflows:
    ios-release:
        name: iOS Release

    environment:
        xcode: latest

    ios_signing:
        distribution_type: app_store
        bundle_identifier: haribol.ekadasi.app

    scripts:
        - npm ci
        - npm install -g cordova

        - cordova platform add ios

        - xcode-project use-profiles

        - |
            cat <<EOF > build.json
            {
            "ios": {
                "release": {
                "codeSignIdentity": "iPhone Distribution",
                "developmentTeam": "$CM_DEVELOPMENT_TEAM",
                "packageType": "app-store",
                "provisioningProfile": "$CM_PROVISIONING_PROFILE_UUID",
                "codeSignEntitlements": "platforms/ios/Экадаши/Entitlements-Release.plist"
                }
            }
            }
            EOF
            
        - export CODE_SIGN_ENTITLEMENTS="platforms/ios/Экадаши/Entitlements-Release.plist"

        - cordova build ios --device --release --buildConfig=build.json

        - find platforms/ios/build -type f | sort
            
    artifacts:
        - platforms/ios/build/device/*.ipa
        - platforms/ios/build/device/*.xcarchive
