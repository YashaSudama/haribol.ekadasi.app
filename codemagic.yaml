workflows:
    ios-release:
        name: iOS Release

        environment:
            xcode: latest
            ios_signing:
                distribution_type: app_store
                bundle_identifier: haribol.ekadasi.app

        scripts:
            - npm ci
            - npm install -g cordova

            - cordova platform add ios

            - xcode-project use-profiles

            - |
                # Автоматически находим путь к файлу, чтобы избежать проблем с кириллицей 'Экадаши'
                ENTITLEMENTS_PATH=$(find platforms/ios -name "Entitlements-Release.plist" | head -n 1)
                echo "Found entitlements at: $ENTITLEMENTS_PATH"
                cat <<EOF > build.json
                {
                "ios": {
                    "release": {
                    "codeSignIdentity": "iPhone Distribution",
                    "developmentTeam": "$CM_DEVELOPMENT_TEAM",
                    "packageType": "app-store",
                    "provisioningProfile": "$CM_PROVISIONING_PROFILE_UUID",
                    "codeSignEntitlements": "$ENTITLEMENTS_PATH"
                    }
                }
                }
                EOF
            
                # Экспортируем переменную для Xcode сборщика
                export CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS_PATH"

            - cordova build ios --device --release --buildConfig=build.json

            - find platforms/ios/build -type f | sort
                
        artifacts:
            - platforms/ios/build/device/*.ipa
            - platforms/ios/build/device/*.xcarchive
