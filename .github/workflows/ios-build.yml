name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Verify SDK
        run: xcodebuild -showsdks

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install dependencies
        run: npm install

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > certificate.p12

          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain

          security import certificate.p12 \
          -k build.keychain \
          -P "$P12_PASSWORD" \
          -T /usr/bin/codesign

          security set-key-partition-list \
          -S apple-tool:,apple:,codesign: \
          -s \
          -k actions \
          build.keychain

      - name: Install provisioning profile
        env:
            BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          cp profile.mobileprovision \
          "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Verify provisioning profile
        run: |
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Show schemes
        run: |
          xcodebuild -list \
          -workspace "platforms/ios/Экадаши.xcworkspace"

      - name: Build
        run: |
          xcodebuild \
          -workspace "platforms/ios/Экадаши.xcworkspace" \
          -scheme "Экадаши" \
          -configuration Release \
          build

      - name: Archive app
        run: |
          xcodebuild archive \
          -workspace "platforms/ios/Экадаши.xcworkspace" \
          -scheme "Экадаши" \
          -configuration Release \
          -archivePath "$RUNNER_TEMP/Экадаши.xcarchive"

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>99K3GM26Y8</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>haribol.ekadasi.app</key>
                  <string>App Store Connect</string>
              </dict>
          </dict>
          </plist>
          EOF
      
      - name: Show installed profile details
        run: |
          security cms -D -i profile.mobileprovision | grep -A1 "<key>Name</key>"
          security cms -D -i profile.mobileprovision | grep -A1 aps-environment

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/Экадаши.xcarchive" \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ekadasi-ipa
          path: ${{ runner.temp }}/export/*.ipa

